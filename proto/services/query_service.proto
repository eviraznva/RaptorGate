syntax = "proto3";

package raptorgate.services;
import "google/protobuf/timestamp.proto";

import "config/config_models.proto";

service FirewallQueryService {
  rpc GetPolicies   (GetPoliciesRequest)       returns (GetPoliciesResponse);
  rpc GetPolicy     (GetPolicyRequest)         returns (GetPolicyResponse);
  rpc GetNatBindings(GetNatBindingsRequest)    returns (GetNatBindingsResponse);

  rpc GetZones      (GetZonesRequest)          returns (GetZonesResponse);
  rpc GetZone       (GetZoneRequest)           returns (GetZoneResponse);
  rpc GetZoneInterfaces (GetZoneInterfacesRequest) returns (GetZoneInterfacesResponse);
  rpc GetZoneInterface (GetZoneInterfaceRequest) returns (GetZoneInterfaceResponse);
  rpc GetLiveZoneInterfaces (GetLiveZoneInterfacesRequest) returns (GetLiveZoneInterfacesResponse);
  rpc GetZonePairs  (GetZonePairsRequest)      returns (GetZonePairsResponse);
  rpc GetZonePair   (GetZonePairRequest)       returns (GetZonePairResponse);

  rpc GetSystemTime (GetSystemTimeRequest)     returns (GetSystemTimeResponse);

  rpc GetPinningStats  (GetPinningStatsRequest)  returns (GetPinningStatsResponse);
  rpc GetPinningBypass (GetPinningBypassRequest) returns (GetPinningBypassResponse);

  rpc SetInterfaceState (SetInterfaceStateRequest) returns (SetInterfaceStateResponse);
}

message GetPoliciesRequest {}
message GetPoliciesResponse {
  repeated config.Rule rules = 1;
}

message GetPolicyRequest {
  string id = 1;
}

message GetPolicyResponse {
  config.Rule rule = 1;
}

message GetNatBindingsRequest {}

message NatBinding {
  uint64 binding_id      = 1;
  string rule_id         = 2;
  string original_src_ip = 3;
  uint32 original_src_port = 4;
  string original_dst_ip = 5;
  uint32 original_dst_port = 6;
  string translated_src_ip = 7;
  uint32 translated_src_port = 8;
  string translated_dst_ip = 9;
  uint32 translated_dst_port = 10;
  uint32 protocol         = 11;
}

message GetNatBindingsResponse {
  repeated NatBinding bindings = 1;
}

message GetZonesRequest {}

message GetZonesResponse {
  repeated config.Zone zones = 1;
}

message GetZoneRequest {
  string id = 1;
}

message GetZoneResponse {
  config.Zone zone = 1;
}

message GetZoneInterfacesRequest {}

message GetZoneInterfacesResponse {
  repeated config.ZoneInterface zone_interfaces = 1;
}

message GetZoneInterfaceRequest {
  string id = 1;
}

message GetZoneInterfaceResponse {
  config.ZoneInterface zone_interface = 1;
}

message GetLiveZoneInterfacesRequest {}

message GetLiveZoneInterfacesResponse {
  repeated config.ZoneInterface zone_interfaces = 1;
}

message GetZonePairsRequest {}

message GetZonePairsResponse {
  repeated config.ZonePair zone_pairs = 1;
}

message GetZonePairRequest {
  string id = 1;
}

message GetZonePairResponse {
  config.ZonePair zone_pair = 1;
}

message GetSystemTimeRequest {}

message GetSystemTimeResponse {
  google.protobuf.Timestamp time = 1;
}

message GetPinningStatsRequest {}

message GetPinningStatsResponse {
  uint64 active_bypasses = 1;
  uint64 tracked_failures = 2;
}

message GetPinningBypassRequest {
  string source_ip = 1;
  string domain = 2;
}

message GetPinningBypassResponse {
  bool found = 1;
  string reason = 2;
  uint32 failure_count = 3;
}

message SetInterfaceStateRequest {
  string id = 1;
  config.InterfaceAdministrativeState state = 2;
}

message SetInterfaceStateResponse {}

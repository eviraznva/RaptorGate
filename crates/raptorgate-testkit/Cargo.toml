[package]
name = "raptorgate-testkit"
version = "0.1.0"
edition = "2024"

[dependencies]
ngfw = { path = "../raptorgate", features = ["test-capture"] }
tokio = { version = "1.50.0", features = ["macros", "rt", "time", "fs"] }
uuid = { version = "1.22.0", features = ["v7"] }
ipnet = "2.12.0"
tempfile = "3"
thiserror = "2.0.18"
etherparse = "0.19.0"
anyhow = "1.0.102"
